<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="FinFit · 专注纯粹训练的健身追踪系统。记录每一组、追踪每一次突破。" />
    <title>FinFit | 鱼健 · 专注纯粹训练</title>
    <style>
      /* ── App Shell 骨架屏样式 ─────────────────────────────────── */
      #app-shell {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
        transition: opacity 0.4s ease;
      }
      #app-shell.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .shell-logo {
        width: 80px;
        height: 80px;
        border-radius: 24px;
        object-fit: cover;
        animation: shell-breathe 2s ease-in-out infinite;
        box-shadow: 0 0 30px rgba(16, 185, 129, 0.3);
      }
      .shell-title {
        margin-top: 20px;
        font-size: 28px;
        font-weight: 900;
        color: #10b981;
        letter-spacing: -1px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      .shell-subtitle {
        margin-top: 8px;
        font-size: 12px;
        color: #525252;
        letter-spacing: 4px;
        text-transform: uppercase;
        font-weight: 700;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      .shell-dots {
        display: flex;
        gap: 6px;
        margin-top: 32px;
      }
      .shell-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #10b981;
        opacity: 0.3;
        animation: shell-dot-pulse 1.4s ease-in-out infinite;
      }
      .shell-dot:nth-child(2) { animation-delay: 0.2s; }
      .shell-dot:nth-child(3) { animation-delay: 0.4s; }
      @keyframes shell-breathe {
        0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(16, 185, 129, 0.2); }
        50% { transform: scale(1.05); box-shadow: 0 0 40px rgba(16, 185, 129, 0.4); }
      }
      @keyframes shell-dot-pulse {
        0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
        40% { opacity: 1; transform: scale(1.2); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- App Shell 骨架屏：React 挂载后会自动替换此内容 -->
      <div id="app-shell">
        <img src="/pwa-192x192.png" alt="FinFit" class="shell-logo" />
        <div class="shell-title">FinFit</div>
        <div class="shell-subtitle">专注纯粹训练</div>
        <div class="shell-dots">
          <div class="shell-dot"></div>
          <div class="shell-dot"></div>
          <div class="shell-dot"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
